<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0D0D" />
    <title>{{ title }} — ServiSalo</title>
    {% include "_favicon.html" %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
  </head>
  <body class="page-gradient">
    <main class="auth">
      <a class="auth__back" href="{{ url_for('home') }}">← Inicio</a>

      <h1 class="brand brand--auth">
        <span class="brand-servi">Servi</span><span class="brand-salo">Salo</span>
      </h1>

      <div class="auth__placeholder">
        <p><strong>{{ title }}</strong></p>
        <p>{{ message }}</p>
      </div>

      {% if ok and cta_href %}
      <a class="btn btn--primary btn--uppercase" href="{{ cta_href }}">{{ cta_label }}</a>
      {% elif show_resend %}
      <form class="auth__form" id="resend-form">
        <label class="field">
          <span class="field__label">Tu correo</span>
          <input class="field__input" type="email" name="email" required autocomplete="email" />
        </label>
        <p class="auth__error" id="resend-error" hidden></p>
        <p class="auth__success" id="resend-success" hidden></p>
        <button type="submit" class="btn btn--primary btn--uppercase" id="resend-submit">
          REENVIAR CORREO
        </button>
      </form>
      <p class="auth__footer"><a href="{{ url_for('login_page') }}">Volver al login</a></p>
      <script type="module" src="{{ url_for('static', filename='js/resend_verification.js') }}"></script>
      {% else %}
      <p class="auth__footer"><a href="{{ url_for('login_page') }}">Ir a iniciar sesión</a></p>
      {% endif %}
    </main>
  </body>
</html>
