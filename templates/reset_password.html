<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0D0D" />
    <title>Nueva contraseña — ServiSalo</title>
    {% include "_favicon.html" %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
  </head>
  <body class="page-gradient">
    <main class="auth">
      <a class="auth__back" href="{{ url_for('login_page') }}">← Volver</a>

      <h1 class="brand brand--auth">
        <span class="brand-servi">Servi</span><span class="brand-salo">Salo</span>
      </h1>
      <p class="auth__subtitle">Elige tu nueva contraseña</p>

      {% if not token %}
      <div class="auth__placeholder">
        <p>Este enlace no es válido. Solicita uno nuevo desde «Olvidé mi contraseña».</p>
      </div>
      <p class="auth__footer">
        <a href="{{ url_for('forgot_password_page') }}">Solicitar enlace</a>
      </p>
      {% else %}
      <form class="auth__form" id="reset-form" novalidate>
        <input type="hidden" name="token" value="{{ token }}" />
        <label class="field">
          <span class="field__label">Nueva contraseña</span>
          <input
            class="field__input"
            type="password"
            name="password"
            autocomplete="new-password"
            minlength="6"
            required
          />
        </label>
        <label class="field">
          <span class="field__label">Confirmar contraseña</span>
          <input
            class="field__input"
            type="password"
            name="password_confirm"
            autocomplete="new-password"
            minlength="6"
            required
          />
        </label>

        <p class="auth__error" id="reset-error" hidden></p>
        <p class="auth__success" id="reset-success" hidden></p>

        <button type="submit" class="btn btn--primary btn--uppercase" id="reset-submit">
          GUARDAR CONTRASEÑA
        </button>
      </form>
      {% endif %}
    </main>

    {% if token %}
    <script type="module" src="{{ url_for('static', filename='js/reset_password.js') }}"></script>
    {% endif %}
  </body>
</html>
