<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0D0D" />
    <title>Olvidé mi contraseña — ServiSalo</title>
    {% include "_favicon.html" %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
  </head>
  <body class="page-gradient">
    <main class="auth">
      <a class="auth__back" href="{{ url_for('login_page') }}">← Volver</a>

      <h1 class="brand brand--auth">
        <span class="brand-servi">Servi</span><span class="brand-salo">Salo</span>
      </h1>
      <p class="auth__subtitle">Te enviaremos un enlace para restablecer tu contraseña</p>

      <form class="auth__form" id="forgot-form" novalidate>
        <label class="field">
          <span class="field__label">Correo electrónico</span>
          <input class="field__input" type="email" name="email" autocomplete="email" required />
        </label>

        <p class="auth__error" id="forgot-error" hidden></p>
        <p class="auth__success" id="forgot-success" hidden></p>

        <button type="submit" class="btn btn--primary btn--uppercase" id="forgot-submit">
          ENVIAR ENLACE
        </button>
      </form>

      <p class="auth__footer">
        <a href="{{ url_for('login_page') }}">Volver a iniciar sesión</a>
      </p>
    </main>

    <script type="module" src="{{ url_for('static', filename='js/forgot_password.js') }}"></script>
  </body>
</html>
